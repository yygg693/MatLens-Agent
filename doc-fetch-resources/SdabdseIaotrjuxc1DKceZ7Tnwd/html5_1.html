<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="MatLens Agent 能力生态规模：核心工具实现140、可选技能115、内置技能82、工具集36、模型提供方34、平台适配器31、记忆提供方8，均为2026-09-18本机实测">
<title>MatLens Agent 能力生态规模</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; background: #fff; color: #1A2B4A; padding: 12px 4px; }
  .chart-title { font-size: 15px; font-weight: 700; color: #1A2B4A; margin-bottom: 2px; }
  .chart-sub { font-size: 11px; color: #758092; margin-bottom: 14px; }
  .bar-row { display: flex; align-items: center; margin-bottom: 9px; }
  .bar-label { width: 120px; flex: 0 0 120px; font-size: 12px; color: #1A2B4A; text-align: right; padding-right: 10px; white-space: nowrap; }
  .bar-track { flex: 1; background: #DDE0E4; border-radius: 3px; height: 18px; position: relative; }
  .bar-fill { height: 100%; background: #1A2B4A; border-radius: 3px; min-width: 2px; }
  .bar-fill.alt { background: #758092; }
  .bar-val { position: absolute; right: -34px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700; color: #1A2B4A; width: 28px; }
  .note { font-size: 11px; color: #758092; margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="chart-title">MatLens Agent 能力生态规模</div>
  <div class="chart-sub">单位：项 / 文件数（2026-09-18 本机实测）</div>
  <div class="bar-row"><div class="bar-label">核心工具实现</div><div class="bar-track"><div class="bar-fill" style="width:100%"></div><div class="bar-val">140</div></div></div>
  <div class="bar-row"><div class="bar-label">可选技能</div><div class="bar-track"><div class="bar-fill" style="width:82%"></div><div class="bar-val">115</div></div></div>
  <div class="bar-row"><div class="bar-label">内置技能</div><div class="bar-track"><div class="bar-fill" style="width:59%"></div><div class="bar-val">82</div></div></div>
  <div class="bar-row"><div class="bar-label">工具集</div><div class="bar-track"><div class="bar-fill" style="width:26%"></div><div class="bar-val">36</div></div></div>
  <div class="bar-row"><div class="bar-label">模型提供方</div><div class="bar-track"><div class="bar-fill alt" style="width:24%"></div><div class="bar-val">34</div></div></div>
  <div class="bar-row"><div class="bar-label">平台适配器</div><div class="bar-track"><div class="bar-fill alt" style="width:22%"></div><div class="bar-val">31</div></div></div>
  <div class="bar-row"><div class="bar-label">记忆提供方</div><div class="bar-track"><div class="bar-fill alt" style="width:6%"></div><div class="bar-val">8</div></div></div>
  <div class="note">条形宽度按最大值 140 归一化。深色条为工具与技能类，浅色条为接入生态类；数据来自本机文件系统统计。</div>
</body>
</html>
